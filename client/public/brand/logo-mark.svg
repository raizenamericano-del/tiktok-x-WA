<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="kgrad" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#5b4dff"/>
      <stop offset="38%" stop-color="#a03cff"/>
      <stop offset="72%" stop-color="#ff3f9a"/>
      <stop offset="100%" stop-color="#22e3c4"/>
    </linearGradient>
    <linearGradient id="kshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="kglow" cx="28%" cy="16%" r="82%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kring" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="238" fill="url(#kgrad)"/>
  <rect width="1024" height="1024" rx="238" fill="url(#kglow)"/>
  <rect width="1024" height="1024" rx="238" fill="url(#kshine)"/>
  <!-- status ring (ada celah = lagi live) -->
  <circle cx="512" cy="512" r="344" fill="none" stroke="url(#kring)"
          stroke-width="56" stroke-linecap="round" stroke-dasharray="1880 300"
          transform="rotate(-52 512 512)"/>
  <!-- monogram K -->
  <g stroke="#ffffff" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M418 336 L418 688"/>
    <path d="M452 512 L596 356"/>
    <path d="M452 512 L610 682"/>
  </g>
</svg>
